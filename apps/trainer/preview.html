<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GREKFIT — Веб / Мобайл</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Прев'ю-шелл адмінки: та сама мова, що й екран Клієнти —
   темний канвас, волосяні бордери, білий CTA-pill, жодних зайвих коробок.
   Мобільний вигляд — НЕ імітація: iframe завширшки 390px, тож медіа-запити
   адмінки спрацьовують по-справжньому. */
:root{
  --bg:#07080a; --s1:#0d0e10; --s2:#121316; --s3:#17181c;
  --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.16);
  --ink:#f4f4f6; --mute:#9c9c9d; --accent:#E8FF00;
  --font:'Inter',-apple-system,sans-serif; --font-display:'Oswald',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ── Шапка ── */
.bar{display:flex;align-items:center;gap:14px;padding:12px 18px;flex:0 0 auto;
  border-bottom:1px solid var(--hair);background:var(--s1)}
.brand{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.05em}
.brand b{color:var(--accent)}
.bar-sub{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.14em}
@media(max-width:560px){ .bar-sub{display:none} }

/* Сегмент-перемикач: активний = білий pill (Raycast-хід) */
.seg{display:flex;gap:3px;padding:3px;border-radius:999px;background:var(--s3);
  border:1px solid var(--hair);margin-left:auto}
.seg button{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 16px;border-radius:999px;
  font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap;
  transition:background .2s,color .2s,transform .15s cubic-bezier(.2,.8,.3,1.3)}
.seg button:active{transform:scale(.94)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:#0a0a0c}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg svg{display:block}

.icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:var(--mute);border:1px solid var(--hair);background:var(--s2);flex:0 0 auto;
  transition:color .15s,border-color .15s,transform .15s}
.icon-btn:hover{color:var(--ink);border-color:var(--hair2)}
.icon-btn:active{transform:scale(.92)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Сцена ── */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px;gap:26px;
  background:radial-gradient(1100px 60% at 50% -10%,rgba(232,255,0,.05),transparent 70%)}
body[data-mode="web"] .stage{padding:0;align-items:stretch;gap:0}
/* Обидва: веб зліва тягнеться, телефон справа фіксований */
body[data-mode="both"] .stage{padding:18px 20px;align-items:stretch;gap:22px}

/* Веб: iframe на всю сцену */
.web-frame{width:100%;height:100%;border:0;display:none;background:var(--bg)}
body[data-mode="web"] .web-frame{display:block}
body[data-mode="both"] .web-frame{display:block;flex:1;min-width:0;height:100%;
  border-radius:14px;border:1px solid var(--hair2);background:var(--s1)}

/* Мобайл: екран = рівно 402×874 (iPhone 16 Pro, логічні пікселі) — саме стільки
   бачать медіа-запити застосунку; бордюр телефона додається НАВКОЛО через padding,
   тож box-sizing:content-box, і в'юпорт лишається чистим 402. */
.phone{display:none;position:relative;box-sizing:content-box;
  width:402px;height:874px;max-height:100%;flex:0 0 auto;
  border-radius:50px;padding:10px;background:linear-gradient(180deg,#1c1d21,#0c0d0f);
  border:1px solid var(--hair2);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.09)}
body[data-mode="mobile"] .phone,
body[data-mode="both"] .phone{display:block}
.phone-screen{position:relative;width:100%;height:100%;border-radius:41px;overflow:hidden;background:#000}
.phone-screen iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
/* Динамічний острівець — щоб було видно, що контент під нього не лізе */
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:31px;
  border-radius:999px;background:#000;z-index:2;pointer-events:none}
/* Телефон не влазить у низькі вікна — стискаємо пропорційно.
   У режимі «обидва» стискаємо від ПРАВОГО краю, щоб не було дірки збоку. */
@media(max-height:900px){ .phone{transform:scale(.92);transform-origin:center} }
@media(max-height:820px){ .phone{transform:scale(.84)} }
@media(max-height:740px){ .phone{transform:scale(.74)} }
body[data-mode="both"] .phone{transform-origin:right center}
/* Телефон у режимі «обидва» не має розпирати сцену власною висотою */
body[data-mode="both"] .phone{height:min(874px,100%)}

.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
  font-size:11px;color:var(--mute);letter-spacing:.04em;pointer-events:none}
body[data-mode="web"] .hint,body[data-mode="both"] .hint{display:none}
@media(max-width:560px){ .hint{display:none} }
/* «Обидва» вимагає ширини — на вузькому вікні ховаємо кнопку, щоб не обіцяти зайвого */
@media(max-width:1100px){ #btn-both{display:none} }
</style>
</head>
<body data-mode="web">

<div class="bar">
  <div>
    <div class="brand">GREK<b>FIT</b></div>
    <div class="bar-sub">Кабінет тренера</div>
  </div>

  <div class="seg" role="tablist" aria-label="Версія">
    <button id="btn-web" role="tab" aria-selected="true" onclick="setMode('web')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      Веб
    </button>
    <button id="btn-mobile" role="tab" aria-selected="false" onclick="setMode('mobile')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
      Мобайл
    </button>
    <button id="btn-both" role="tab" aria-selected="false" onclick="setMode('both')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="12" height="12" rx="2"/><rect x="16" y="3" width="6" height="15" rx="2"/></svg>
      Обидва
    </button>
  </div>

  <button class="icon-btn" onclick="reloadFrame()" title="Перезавантажити" aria-label="Перезавантажити">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
</div>

<div class="stage">
  <iframe class="web-frame" id="f-web" title="Адмінка — веб"></iframe>
  <div class="phone">
    <div class="notch"></div>
    <div class="phone-screen"><iframe id="f-mobile" title="Адмінка — мобайл"></iframe></div>
  </div>
</div>

<div class="hint">iPhone 16 Pro · 402 × 874 — реальна мобільна верстка, не масштаб &nbsp;·&nbsp; W / M / B</div>

<script>
// Адмінка лежить поруч; той самий origin → сесія й localStorage спільні,
// тому логінитись у прев'ю окремо не треба.
var SRC = 'index.html';
// ⚠️ Свій ключ: `fc_preview_mode` уже зайнятий прев'ю КЛІЄНТСЬКОГО апу
// (там лежить 'client-phone'/'trainer-web'), і чуже значення ламало показ.
// Плюс валідація — у data-mode має потрапляти лише відоме значення.
var MODES = {web:1, mobile:1, both:1};
var MODE = localStorage.getItem('fc_admin_preview_mode');
if(!MODES[MODE]) MODE = 'web';           // дефолт — перемикач (веб), «Обидва» за бажанням

function setMode(m){
  if(!MODES[m]) m = 'both';
  // «Обидва» потребує ширини; на вузькому вікні тихо падаємо у «веб»,
  // інакше телефон витіснив би адмінку в 200px і дивитись було б нічого.
  if(m==='both' && window.innerWidth < 1100) m = 'web';
  MODE = m;
  localStorage.setItem('fc_admin_preview_mode', m);
  document.body.dataset.mode = m;
  ['web','mobile','both'].forEach(function(k){
    var b=document.getElementById('btn-'+k); if(!b) return;
    b.classList.toggle('on', m===k);
    b.setAttribute('aria-selected', String(m===k));
  });
  // Вантажимо лише потрібні рамки: зайвий живий екземпляр адмінки
  // дублював би запити до Supabase і плутав стан.
  var needWeb    = (m==='web'    || m==='both');
  var needMobile = (m==='mobile' || m==='both');
  [['f-web',needWeb],['f-mobile',needMobile]].forEach(function(p){
    var el=document.getElementById(p[0]);
    if(p[1]){
      // ⚠️ src ставимо СИНХРОННО. Раніше тут був requestAnimationFrame (щоб
      // iframe встиг отримати розмір), але rAF не спрацьовує, коли сторінка не
      // малюється — рамки лишались about:blank назавжди. Розмір і так готовий:
      // CSS уже розібрано, а setMode() викликається в кінці скрипта.
      if(!el.getAttribute('src')) el.setAttribute('src', SRC);
    } else if(el.getAttribute('src')){ el.removeAttribute('src'); }
  });
}
function reloadFrame(){
  var t=Date.now();
  ['f-web','f-mobile'].forEach(function(id){
    var f=document.getElementById(id);
    if(f && f.src) f.src = SRC + '?r=' + t;   // у режимі «обидва» оновлюємо обидві
  });
}
// Звузили вікно на «обидва» — не лишаємо зламаний вигляд
window.addEventListener('resize', function(){
  if(MODE==='both' && window.innerWidth < 1100) setMode('web');
});
// W / M / B — швидке перемикання з клавіатури (латиниця й кирилична розкладка)
document.addEventListener('keydown', function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  var k = e.key.toLowerCase();
  if(k==='w'||k==='ц') setMode('web');
  if(k==='m'||k==='ь') setMode('mobile');
  if(k==='b'||k==='и') setMode('both');
});
setMode(MODE);
</script>
</body>
</html>
