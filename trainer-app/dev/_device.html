<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrekFit — iPhone 17 Pro Max preview</title>
<style>
  :root{
    --screen-w: 440px;
    --screen-h: 956px;
    --bezel: 14px;
    --frame-r: 70px;
    --screen-r: 56px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100%;padding:40px 0;
    background:
      radial-gradient(60% 45% at 50% 22%, #34343a 0%, rgba(52,52,58,0) 70%),
      linear-gradient(160deg, #1b1b1f 0%, #101012 55%, #08080a 100%);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  }

  .device{
    position:relative;
    width:calc(var(--screen-w) + var(--bezel)*2);
    height:calc(var(--screen-h) + var(--bezel)*2);
    border-radius:var(--frame-r);
    padding:var(--bezel);
    background:
      linear-gradient(150deg, #5a5d63 0%, #2a2b2e 18%, #3c3e42 40%,
        #232427 62%, #4c4e52 82%, #1d1e20 100%);
    box-shadow:
      0 0 0 2px #050506,
      0 2px 3px rgba(255,255,255,.10) inset,
      0 -2px 3px rgba(0,0,0,.55) inset,
      0 38px 80px -12px rgba(0,0,0,.85),
      0 12px 28px -8px rgba(0,0,0,.7);
  }
  /* titanium edge highlight */
  .device::before{
    content:"";position:absolute;inset:3px;border-radius:calc(var(--frame-r) - 3px);
    background:linear-gradient(150deg,
      rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 22%,
      rgba(255,255,255,0) 78%, rgba(255,255,255,.16) 100%);
    pointer-events:none;
  }

  .screen{
    position:relative;
    width:var(--screen-w);height:var(--screen-h);
    border-radius:var(--screen-r);
    background:#000;
    overflow:hidden;
    box-shadow:0 0 0 3px #000, 0 0 16px rgba(0,0,0,.6) inset;
  }
  iframe{
    position:absolute;inset:0;
    width:100%;height:100%;
    border:0;display:block;background:#0b0b0c;
  }

  /* Dynamic Island */
  .island{
    position:absolute;top:13px;left:50%;transform:translateX(-50%);
    width:126px;height:37px;
    background:#000;border-radius:20px;
    z-index:20;pointer-events:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.05);
  }
  .island::after{
    content:"";position:absolute;top:50%;right:13px;transform:translateY(-50%);
    width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2f3a44 0%, #060708 70%);
    box-shadow:0 0 0 1px rgba(255,255,255,.06);
  }

  /* side buttons */
  .btn{
    position:absolute;
    background:linear-gradient(180deg,#5b5d62,#2a2b2e);
    box-shadow:0 1px 1px rgba(0,0,0,.5);
  }
  .btn.l{left:-3px;border-radius:3px 0 0 3px;width:4px;}
  .btn.r{right:-3px;border-radius:0 3px 3px 0;width:4px;}
  .btn.action{top:148px;height:30px;}
  .btn.vol-up{top:212px;height:62px;}
  .btn.vol-down{top:290px;height:62px;}
  .btn.power{top:236px;height:104px;}
  .btn.camera{top:372px;height:42px;width:4px;}

  .caption{
    position:fixed;left:0;right:0;bottom:14px;
    text-align:center;color:#5c5c63;
    font-size:12px;letter-spacing:.3px;
  }
  .caption b{color:#8a8a92;font-weight:600;}
</style>
</head>
<body>
  <div class="device">
    <div class="btn l action"></div>
    <div class="btn l vol-up"></div>
    <div class="btn l vol-down"></div>
    <div class="btn r power"></div>
    <div class="btn r camera"></div>
    <div class="screen">
      <div class="island"></div>
      <iframe
        src="../index.html"
        title="GrekFit"
        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"></iframe>
    </div>
  </div>
  <div class="caption"><b>iPhone 17 Pro Max</b> &middot; 440 &times; 956 &middot; dev-превʼю</div>
</body>
</html>
