<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrekFit — iPhone 16 Pro · DEMO</title>
<style>
  :root{
    /* iPhone 16 Pro logical viewport: 393 × 852 pt */
    --screen-w: 393px;
    --screen-h: 852px;
    --bezel: 12px;
    --frame-r: 62px;
    --screen-r: 50px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100%;padding:0;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  }

  .device{
    position:relative;
    width:calc(var(--screen-w) + var(--bezel)*2);
    height:calc(var(--screen-h) + var(--bezel)*2);
    border-radius:var(--frame-r);
    padding:var(--bezel);
    background:
      linear-gradient(150deg, #5a5d63 0%, #2a2b2e 18%, #3c3e42 40%,
        #232427 62%, #4c4e52 82%, #1d1e20 100%);
    box-shadow:
      0 0 0 2px #050506,
      0 2px 3px rgba(255,255,255,.10) inset,
      0 -2px 3px rgba(0,0,0,.55) inset,
      0 38px 80px -12px rgba(0,0,0,.85),
      0 12px 28px -8px rgba(0,0,0,.7);
  }
  .device::before{
    content:"";position:absolute;inset:3px;border-radius:calc(var(--frame-r) - 3px);
    background:linear-gradient(150deg,
      rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 22%,
      rgba(255,255,255,0) 78%, rgba(255,255,255,.16) 100%);
    pointer-events:none;
  }

  .screen{
    position:relative;
    width:var(--screen-w);height:var(--screen-h);
    border-radius:var(--screen-r);
    background:#000;
    overflow:hidden;
    box-shadow:0 0 0 3px #000, 0 0 16px rgba(0,0,0,.6) inset;
  }
  iframe{
    position:absolute;inset:0;
    width:100%;height:100%;
    border:0;display:block;background:#0b0b0c;
  }

  /* Dynamic Island — slightly smaller on 16 Pro vs 17 Pro Max */
  .island{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:118px;height:35px;
    background:#000;border-radius:18px;
    z-index:20;pointer-events:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.05);
  }
  .island::after{
    content:"";position:absolute;top:50%;right:12px;transform:translateY(-50%);
    width:8px;height:8px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2f3a44 0%, #060708 70%);
    box-shadow:0 0 0 1px rgba(255,255,255,.06);
  }

  .btn{
    position:absolute;
    background:linear-gradient(180deg,#5b5d62,#2a2b2e);
    box-shadow:0 1px 1px rgba(0,0,0,.5);
  }
  .btn.l{left:-3px;border-radius:3px 0 0 3px;width:4px;}
  .btn.r{right:-3px;border-radius:0 3px 3px 0;width:4px;}
  .btn.action{top:130px;height:28px;}
  .btn.vol-up{top:190px;height:54px;}
  .btn.vol-down{top:260px;height:54px;}
  .btn.power{top:210px;height:90px;}
  .btn.camera{top:336px;height:38px;width:4px;}

  /* Small DEMO badge in the corner so screenshots can be clearly identified
     while we're working. Easy to remove for final exports. */
  .demo-tag{
    position:fixed;top:14px;right:14px;
    padding:4px 9px;border-radius:6px;
    background:rgba(232,255,0,.18);color:#E8FF00;
    font-weight:800;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid rgba(232,255,0,.4);
    pointer-events:none;z-index:30;
  }
</style>
</head>
<body>
  <div class="demo-tag">Demo</div>
  <div class="device">
    <div class="btn l action"></div>
    <div class="btn l vol-up"></div>
    <div class="btn l vol-down"></div>
    <div class="btn r power"></div>
    <div class="btn r camera"></div>
    <div class="screen">
      <div class="island"></div>
      <iframe
        src="../index.html?demo=1"
        title="GrekFit · DEMO"
        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"></iframe>
    </div>
  </div>
</body>
</html>
