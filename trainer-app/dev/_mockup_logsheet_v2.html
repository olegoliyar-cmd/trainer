<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log sheet — V2 mockup (iPhone 16 Pro)</title>
<style>
  /* ─── iPhone 16 Pro frame ───────────────────────────── */
  :root {
    /* iPhone 16 Pro logical viewport: 393 × 852 pt */
    --screen-w: 393px;
    --screen-h: 852px;
    --bezel: 12px;
    --frame-r: 62px;
    --screen-r: 50px;

    --bg: #0a0b0c;
    --surface-1: #15171a;
    --surface-2: #1c1f23;
    --surface-3: #25282d;
    --border: #2a2e34;
    --border-soft: #1f2226;
    --text: #f4f5f6;
    --text-soft: #c2c5ca;
    --text-muted: #7d828a;
    --text-dim: #525861;
    --accent: #e5ff00;
    --success: #5be37c;
    --font-heading: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100%;
    background: #000;
    font-family: var(--font-body);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .device {
    position: relative;
    width: calc(var(--screen-w) + var(--bezel)*2);
    height: calc(var(--screen-h) + var(--bezel)*2);
    border-radius: var(--frame-r);
    padding: var(--bezel);
    background:
      linear-gradient(150deg, #5a5d63 0%, #2a2b2e 18%, #3c3e42 40%,
        #232427 62%, #4c4e52 82%, #1d1e20 100%);
    box-shadow:
      0 0 0 2px #050506,
      0 2px 3px rgba(255,255,255,.10) inset,
      0 -2px 3px rgba(0,0,0,.55) inset,
      0 38px 80px -12px rgba(0,0,0,.85),
      0 12px 28px -8px rgba(0,0,0,.7);
  }
  .device::before {
    content: ""; position: absolute; inset: 3px; border-radius: calc(var(--frame-r) - 3px);
    background: linear-gradient(150deg,
      rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 22%,
      rgba(255,255,255,0) 78%, rgba(255,255,255,.16) 100%);
    pointer-events: none;
  }
  .screen {
    position: relative;
    width: var(--screen-w); height: var(--screen-h);
    border-radius: var(--screen-r);
    background: var(--bg);
    overflow: hidden;
    box-shadow: 0 0 0 3px #000, 0 0 16px rgba(0,0,0,.6) inset;
  }
  .island {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 35px;
    background: #000; border-radius: 18px;
    z-index: 30; pointer-events: none;
    box-shadow: 0 0 0 1px rgba(255,255,255,.05);
  }
  .island::after {
    content: ""; position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
    width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2f3a44 0%, #060708 70%);
    box-shadow: 0 0 0 1px rgba(255,255,255,.06);
  }
  .btn-side {
    position: absolute;
    background: linear-gradient(180deg, #5b5d62, #2a2b2e);
    box-shadow: 0 1px 1px rgba(0,0,0,.5);
  }
  .btn-side.l { left: -3px; border-radius: 3px 0 0 3px; width: 4px; }
  .btn-side.r { right: -3px; border-radius: 0 3px 3px 0; width: 4px; }
  .btn-side.action { top: 130px; height: 28px; }
  .btn-side.vol-up { top: 190px; height: 54px; }
  .btn-side.vol-down { top: 260px; height: 54px; }
  .btn-side.power { top: 210px; height: 90px; }
  .btn-side.camera { top: 336px; height: 38px; width: 4px; }

  /* ─── Background workout screen (faint, behind sheet) ─── */
  .workout-bg {
    position: absolute; inset: 0;
    background: var(--bg);
    opacity: 0.45;
    filter: blur(2px);
  }
  .workout-bg::before {
    content: ""; position: absolute; top: 80px; left: 16px; right: 16px;
    height: 60px; border-radius: 14px; background: var(--surface-1);
  }
  .workout-bg::after {
    content: ""; position: absolute; top: 160px; left: 16px; right: 16px;
    bottom: 80px; border-radius: 14px;
    background:
      repeating-linear-gradient(180deg,
        var(--surface-1) 0 70px,
        transparent 70px 84px);
  }
  /* Overlay dim behind the sheet */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.55);
  }
  /* Close button (top of sheet area) */
  .close-btn {
    position: absolute; top: 60px; right: 16px;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    z-index: 25;
  }

  /* ─── Sheet ───────────────────────────────────────────── */
  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--surface-1);
    border-radius: 24px 24px 0 0;
    padding: 12px 14px calc(env(safe-area-inset-bottom, 0px) + 18px);
    display: flex; flex-direction: column;
    gap: 10px;
    box-shadow: 0 -8px 32px rgba(0,0,0,0.4);
  }
  .grabber {
    width: 36px; height: 4px; border-radius: 4px;
    background: var(--border);
    margin: 0 auto 4px;
  }

  /* ── Video bar ── */
  .video-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px 10px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 0 24px -8px rgba(229, 255, 0, 0.16);
  }
  .video-bar .vt {
    display: flex; flex-direction: column; gap: 1px;
  }
  .video-bar .vt-name {
    font-family: var(--font-heading);
    font-size: 13px; font-weight: 700; letter-spacing: 0.2px;
  }
  .video-bar .vt-sub {
    font-size: 11px; color: var(--text-muted);
  }
  .play-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent); color: #000;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .play-btn::after {
    content: ''; width: 0; height: 0;
    border-left: 9px solid #000;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    margin-left: 3px;
  }

  /* ── Header card (stepper + name + goal pill + round badge) ── */
  .head {
    background: var(--surface-2);
    border-radius: 12px;
    padding: 10px 12px 10px;
    border: 1px solid var(--border);
  }
  .stepper {
    display: flex; align-items: center; gap: 4px;
    margin-bottom: 10px;
  }
  .stepper-dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--surface-1); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--text-muted);
  }
  .stepper-dot.active {
    background: var(--accent); color: #000; border-color: var(--accent);
  }
  .stepper-line { flex: 1; height: 2px; background: var(--border); }

  .head-row {
    display: flex; flex-direction: column; gap: 8px;
  }
  .ex-name {
    font-family: var(--font-heading);
    font-size: 17px; font-weight: 700; line-height: 1.15;
    letter-spacing: 0.1px;
  }
  .head-bottom {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;
  }
  .goal-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--accent);
    background: rgba(229, 255, 0, 0.06);
    font-family: var(--font-heading);
    font-size: 12px; letter-spacing: 0.4px;
    color: var(--accent);
  }
  .goal-pill .icon {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--accent);
    display: inline-block;
    position: relative;
  }
  .goal-pill .icon::after {
    content: ''; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent);
  }
  .goal-pill b { font-weight: 800; font-size: 14px; }
  .round-badge {
    font-family: var(--font-heading);
    font-size: 14px; letter-spacing: 1px;
    color: var(--text-soft);
    white-space: nowrap;
  }
  .round-badge b { color: var(--accent); font-weight: 800; }

  /* Back-link slot — fixed height to prevent layout jump */
  .back-slot {
    height: 24px;
    display: flex; align-items: center; justify-content: flex-end;
    margin-top: 6px;
  }
  .back-link {
    font-size: 11px; letter-spacing: 0.4px;
    color: var(--text-muted);
    background: transparent; border: 1px solid var(--border);
    padding: 3px 10px; border-radius: 20px;
  }

  /* ── Step hint (BIG) ── */
  .step-hint {
    font-family: var(--font-heading);
    font-size: 19px; font-weight: 700; letter-spacing: 0.2px;
    color: var(--text);
    text-align: center;
    padding: 4px 0 2px;
  }

  /* ── Value block (WEIGHT | divider | RPE) ── */
  .value-block {
    background: var(--surface-2);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 10px 8px 8px;
    display: grid; grid-template-columns: 1fr 1px 1fr;
    align-items: stretch;
    column-gap: 0;
  }
  .vb-divider {
    background: var(--border);
    width: 1px;
    margin: 6px 0;
  }
  .vb-col {
    text-align: center;
    display: flex; flex-direction: column; justify-content: center;
    padding: 2px 6px;
    position: relative;
  }
  .vb-info-btn {
    position: absolute; top: 2px; right: 4px;
    width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-dim); font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .vb-label {
    font-family: var(--font-heading);
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1px;
  }
  .vb-value {
    font-family: var(--font-heading);
    font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -1.2px;
    color: var(--accent);
  }
  .vb-unit {
    font-size: 10px; letter-spacing: 0.4px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ── Dumbbell hint (paired-dumbbell warning) ── */
  .dbl-hint {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 10px;
    background: rgba(229, 255, 0, 0.04);
    border: 1px solid rgba(229, 255, 0, 0.16);
    margin-top: -2px;
  }
  .dbl-hint .ico {
    flex: none;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    font-size: 14px;
  }
  .dbl-hint .body {
    font-size: 11.5px; line-height: 1.4; color: var(--text-soft);
  }
  .dbl-hint .body b { color: var(--accent); font-weight: 700; }

  /* ── Sub-hint (yellow, under value block) ── */
  .sub-hint {
    text-align: center;
    font-size: 12px; line-height: 1.35;
    color: var(--accent);
    padding: 2px 8px;
  }

  /* ── Chips ── */
  .chips {
    display: flex; gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    padding: 9px 13px; border-radius: 11px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-soft);
    font-size: 14px; font-weight: 600;
    min-width: 46px; text-align: center;
  }
  .chip.sel {
    background: var(--accent); color: #000; border-color: var(--accent);
    font-weight: 800;
  }

  /* ── «Інша» input ── */
  .custom {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-radius: 11px;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 13px;
  }
  .custom .filler { flex: 1; color: var(--text-dim); }

  /* ── CTAs ── */
  .cta-primary {
    background: var(--accent); color: #000;
    border: 0; padding: 13px;
    border-radius: 12px;
    font-family: var(--font-heading);
    font-size: 13px; font-weight: 800; letter-spacing: 0.6px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .cta-ghost {
    background: transparent; color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 12px;
    font-family: var(--font-heading);
    font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .skip-link {
    background: transparent; border: 0;
    color: var(--text-dim);
    font-size: 10.5px; letter-spacing: 0.4px;
    padding: 2px 0;
    text-decoration: underline;
    text-underline-offset: 3px;
    align-self: center;
  }

  /* Annotation box (outside the phone, small label so user knows what they see) */
  .anno {
    position: absolute;
    bottom: -28px; left: 50%; transform: translateX(-50%);
    color: #666; font-size: 11px; letter-spacing: 0.4px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="device">
  <div class="btn-side l action"></div>
  <div class="btn-side l vol-up"></div>
  <div class="btn-side l vol-down"></div>
  <div class="btn-side r power"></div>
  <div class="btn-side r camera"></div>

  <div class="screen">
    <div class="island"></div>

    <!-- Faint workout screen behind -->
    <div class="workout-bg"></div>
    <div class="overlay"></div>

    <!-- Close button -->
    <div class="close-btn">✕</div>

    <!-- ─── THE SHEET ─── -->
    <div class="sheet">
      <div class="grabber"></div>

      <!-- Video -->
      <div class="video-bar">
        <div class="vt">
          <div class="vt-name">Відео пояснення вправи</div>
          <div class="vt-sub">Дивитись техніку виконання</div>
        </div>
        <div class="play-btn"></div>
      </div>

      <!-- Header card -->
      <div class="head">
        <div class="stepper">
          <div class="stepper-dot active">1</div>
          <div class="stepper-line"></div>
          <div class="stepper-dot">2</div>
          <div class="stepper-line"></div>
          <div class="stepper-dot">3</div>
        </div>
        <div class="head-row">
          <div class="ex-name">Жим гантелей під кутом</div>
          <div class="head-bottom">
            <span class="goal-pill"><span class="icon"></span><b>12</b> повт</span>
            <span class="round-badge">ПІДХІД <b>1</b> / 3</span>
          </div>
        </div>
        <div class="back-slot"><!-- empty on weight step --></div>
      </div>

      <!-- Step hint — big -->
      <div class="step-hint">Введи вагу</div>

      <!-- Value block with divider -->
      <div class="value-block">
        <div class="vb-col">
          <div class="vb-label">Вага</div>
          <div class="vb-value">20</div>
          <div class="vb-unit">кг</div>
        </div>
        <div class="vb-divider"></div>
        <div class="vb-col">
          <button class="vb-info-btn">i</button>
          <div class="vb-label">RPE</div>
          <div class="vb-value">7</div>
          <div class="vb-unit">складність</div>
        </div>
      </div>

      <!-- Dumbbell hint (paired-dumbbell exercise warning) -->
      <div class="dbl-hint">
        <div class="ico">⚖</div>
        <div class="body">Вкажи вагу <b>однієї гантелі</b> — об'єм рахуємо за обидві</div>
      </div>

      <!-- Yellow sub-hint -->
      <div class="sub-hint">Підбери вагу так, щоб останні ~3 повторення були важкими</div>

      <!-- Chips -->
      <div class="chips">
        <div class="chip">10</div>
        <div class="chip">14</div>
        <div class="chip">18</div>
        <div class="chip sel">20</div>
        <div class="chip">24</div>
        <div class="chip">28</div>
        <div class="chip">32</div>
      </div>

      <!-- Інша input -->
      <div class="custom">
        <span>Інша:</span>
        <span class="filler">0.0</span>
        <span>кг</span>
      </div>

      <!-- CTA -->
      <button class="cta-primary">Далі → повторення</button>
      <button class="cta-ghost">Пропустити підхід</button>
      <button class="skip-link">Пропустити цю вправу повністю</button>
    </div>
  </div>
</div>

</body>
</html>
