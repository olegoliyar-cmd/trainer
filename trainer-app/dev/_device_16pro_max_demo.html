<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrekFit — iPhone 16 Pro Max · DEMO</title>
<style>
  :root{
    /* iPhone 16 Pro Max logical viewport: 440 × 956 pt */
    --screen-w: 440px;
    --screen-h: 956px;
    --bezel: 13px;
    --frame-r: 68px;
    --screen-r: 55px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100%;padding:0;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  }

  .device{
    position:relative;
    width:calc(var(--screen-w) + var(--bezel)*2);
    height:calc(var(--screen-h) + var(--bezel)*2);
    border-radius:var(--frame-r);
    padding:var(--bezel);
    background:
      linear-gradient(150deg, #5a5d63 0%, #2a2b2e 18%, #3c3e42 40%,
        #232427 62%, #4c4e52 82%, #1d1e20 100%);
    box-shadow:
      0 0 0 2px #050506,
      0 2px 3px rgba(255,255,255,.10) inset,
      0 -2px 3px rgba(0,0,0,.55) inset,
      0 42px 90px -12px rgba(0,0,0,.85),
      0 14px 32px -8px rgba(0,0,0,.7);
  }
  .device::before{
    content:"";position:absolute;inset:3px;border-radius:calc(var(--frame-r) - 3px);
    background:linear-gradient(150deg,
      rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 22%,
      rgba(255,255,255,0) 78%, rgba(255,255,255,.16) 100%);
    pointer-events:none;
  }

  .screen{
    position:relative;
    width:var(--screen-w);height:var(--screen-h);
    border-radius:var(--screen-r);
    background:#000;
    overflow:hidden;
    box-shadow:0 0 0 3px #000, 0 0 16px rgba(0,0,0,.6) inset;
  }
  iframe{
    position:absolute;inset:0;
    width:100%;height:100%;
    border:0;display:block;background:#0b0b0c;
  }

  /* Dynamic Island — Pro Max version, slightly larger than 16 Pro */
  .island{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    width:125px;height:37px;
    background:#000;border-radius:19px;
    z-index:20;pointer-events:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.05);
  }
  .island::after{
    content:"";position:absolute;top:50%;right:13px;transform:translateY(-50%);
    width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2f3a44 0%, #060708 70%);
    box-shadow:0 0 0 1px rgba(255,255,255,.06);
  }

  .btn{
    position:absolute;
    background:linear-gradient(180deg,#5b5d62,#2a2b2e);
    box-shadow:0 1px 1px rgba(0,0,0,.5);
  }
  .btn.l{left:-3px;border-radius:3px 0 0 3px;width:4px;}
  .btn.r{right:-3px;border-radius:0 3px 3px 0;width:4px;}
  .btn.action{top:140px;height:30px;}
  .btn.vol-up{top:204px;height:60px;}
  .btn.vol-down{top:280px;height:60px;}
  .btn.power{top:228px;height:96px;}
  .btn.camera{top:360px;height:40px;width:4px;}

  /* DEMO badge — visual indicator we're in marketing preview mode. */
  .demo-tag{
    position:fixed;top:14px;right:14px;
    padding:4px 9px;border-radius:6px;
    background:rgba(232,255,0,.18);color:#E8FF00;
    font-weight:800;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid rgba(232,255,0,.4);
    pointer-events:none;z-index:30;
  }
</style>
</head>
<body>
  <div class="demo-tag">Demo · 16 Pro Max</div>
  <div class="device">
    <div class="btn l action"></div>
    <div class="btn l vol-up"></div>
    <div class="btn l vol-down"></div>
    <div class="btn r power"></div>
    <div class="btn r camera"></div>
    <div class="screen">
      <div class="island"></div>
      <iframe
        id="app-frame"
        src="../index.html?demo=1"
        title="GrekFit · DEMO"
        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"></iframe>
    </div>
  </div>
</body>
</html>
