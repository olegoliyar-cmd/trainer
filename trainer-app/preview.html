<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FITCOACH — прев'ю (3 версії)</title>
<style>
  :root{
    --screen-w:393px; --screen-h:852px; --bezel:12px; --frame-r:62px; --screen-r:50px; --safe-top:50px;
    --bar-h:60px;
    --accent:#E8FF00;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  body{display:flex;flex-direction:column;min-height:100%;overflow:hidden;
    background:
      radial-gradient(72vw 52vh at 50% 40%, rgba(232,255,0,.06), transparent 60%),
      radial-gradient(90vw 70vh at 50% 116%, rgba(120,126,140,.05), transparent 60%),
      #000;}

  /* ── Switcher bar ── */
  .switcher{height:var(--bar-h);flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;
    z-index:30;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.5);backdrop-filter:blur(10px)}
  .switcher button{
    display:flex;align-items:center;gap:8px;
    font:600 13px/1 -apple-system,system-ui,sans-serif;color:rgba(255,255,255,.62);
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
    border-radius:11px;padding:9px 15px;cursor:pointer;transition:.15s}
  .switcher button .ico{font-size:14px}
  .switcher button:hover{color:#fff;border-color:rgba(255,255,255,.18)}
  .switcher button.active{color:#0a0a0c;background:linear-gradient(180deg,#f3ff14,#cbdc01);border-color:transparent;box-shadow:0 4px 16px rgba(225,255,1,.22)}
  .switcher .sub{position:absolute;left:16px;font:600 12px/1 system-ui;color:rgba(255,255,255,.3);letter-spacing:.08em}

  /* ── Stage ── */
  .stage-wrap{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
  body::after{content:"";position:fixed;inset:var(--bar-h) 0 0 0;z-index:0;pointer-events:none;
    background:radial-gradient(118% 92% at 50% 50%, transparent 52%, rgba(0,0,0,.7) 100%)}

  /* PHONE (iPhone 16 Pro frame) */
  .stage{transform-origin:center center;position:relative;z-index:1}
  .device{position:relative;width:calc(var(--screen-w) + var(--bezel)*2);height:calc(var(--screen-h) + var(--bezel)*2);
    border-radius:var(--frame-r);padding:var(--bezel);
    background:linear-gradient(150deg,#5a5d63 0%,#2a2b2e 18%,#3c3e42 40%,#232427 62%,#4c4e52 82%,#1d1e20 100%);
    box-shadow:0 0 0 2px #050506,0 2px 3px rgba(255,255,255,.10) inset,0 -2px 3px rgba(0,0,0,.55) inset,0 38px 80px -12px rgba(0,0,0,.85),0 12px 28px -8px rgba(0,0,0,.7)}
  .device::before{content:"";position:absolute;inset:-9% -14%;z-index:-1;pointer-events:none;
    background:radial-gradient(54% 46% at 50% 46%, rgba(232,255,0,.12), transparent 72%);filter:blur(48px)}
  .screen{position:relative;width:var(--screen-w);height:var(--screen-h);border-radius:var(--screen-r);background:#000;overflow:hidden;box-shadow:0 0 0 3px #000,0 0 16px rgba(0,0,0,.6) inset}
  .device iframe{position:absolute;top:var(--safe-top);left:0;width:100%;height:calc(100% - var(--safe-top));border:0;display:block;background:#0b0b0c}
  .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:118px;height:35px;background:#000;border-radius:18px;z-index:20;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.05)}
  .statusbar{position:absolute;top:0;left:0;width:100%;height:var(--safe-top);z-index:15;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:#fff;font-size:15px;font-weight:600;letter-spacing:.3px}
  .statusbar svg{display:block}
  .home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.32);z-index:20;pointer-events:none}

  /* WEB (desktop dashboard) */
  .web{position:absolute;inset:18px;z-index:1;display:none;border-radius:16px;overflow:hidden;
    border:1px solid rgba(255,255,255,.1);background:#0b0b0c;box-shadow:0 30px 70px -20px rgba(0,0,0,.8)}
  .web-chrome{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#16181b;border-bottom:1px solid rgba(255,255,255,.06)}
  .web-dot{width:11px;height:11px;border-radius:50%}
  .web-url{margin-left:12px;font:500 12px/1 system-ui;color:rgba(255,255,255,.4);background:rgba(255,255,255,.05);padding:6px 12px;border-radius:7px}
  .web iframe{width:100%;height:calc(100% - 38px);border:0;display:block;background:#010102}

  body[data-mode="trainer-web"] .stage{display:none}
  body[data-mode="trainer-web"] .web{display:block}
</style>
</head>
<body data-mode="client-phone">
  <div class="switcher">
    <span class="sub">FITCOACH · прев'ю</span>
    <button data-mode="client-phone" class="active"><span class="ico">📱</span> Клієнт · телефон</button>
    <button data-mode="trainer-phone"><span class="ico">📱</span> Тренер · телефон</button>
    <button data-mode="trainer-web"><span class="ico">💻</span> Тренер · веб</button>
  </div>

  <div class="stage-wrap">
    <!-- PHONE -->
    <div class="stage" id="stage">
      <div class="device">
        <div class="screen">
          <div class="island"></div>
          <div class="statusbar">
            <span>9:41</span>
            <span style="display:flex;align-items:center;gap:6px">
              <svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
              <svg width="16" height="11" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l-1.3 1.3A6.6 6.6 0 0 0 8 4.1 6.6 6.6 0 0 0 3.3 5.9L2 4.6A8.5 8.5 0 0 1 8 2.2Zm0 3.3c1.4 0 2.7.5 3.6 1.5l-1.3 1.3A2.9 2.9 0 0 0 8 7.4c-.9 0-1.7.3-2.3.9L4.4 7A5 5 0 0 1 8 5.5Zm0 3.3c.6 0 1.1.2 1.5.6L8 10.3 6.5 9.4c.4-.4.9-.6 1.5-.6Z"/></svg>
              <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="#fff" stroke-opacity=".4"/><rect x="3" y="3" width="15" height="6" rx="1.5" fill="#fff"/><rect x="23.5" y="4" width="1.5" height="4" rx=".75" fill="#fff" fill-opacity=".5"/></svg>
            </span>
          </div>
          <iframe id="phone-frame" title="app" allow="autoplay; fullscreen; clipboard-write; encrypted-media"></iframe>
          <div class="home-ind"></div>
        </div>
      </div>
    </div>

    <!-- WEB -->
    <div class="web" id="web">
      <div class="web-chrome">
        <span class="web-dot" style="background:#ff5f57"></span><span class="web-dot" style="background:#febc2e"></span><span class="web-dot" style="background:#28c840"></span>
        <span class="web-url">fitcoach.app/trainer</span>
      </div>
      <iframe id="web-frame" title="trainer web"></iframe>
    </div>
  </div>

<script>
  var CLIENT_URL  = '/index.html?client=cl_demo';   // клієнт (демо, з призначеною програмою)
  var TRAINER_URL = '/trainer/';                      // тренерська адмінка

  var phone = document.getElementById('phone-frame');
  var web   = document.getElementById('web-frame');
  var stage = document.getElementById('stage');
  var loaded = { phone:null, web:false };

  function setMode(mode){
    document.body.dataset.mode = mode;
    document.querySelectorAll('.switcher button').forEach(function(b){ b.classList.toggle('active', b.dataset.mode===mode); });
    if(mode==='client-phone'){ if(loaded.phone!=='client'){ phone.src=CLIENT_URL; loaded.phone='client'; } }
    else if(mode==='trainer-phone'){ if(loaded.phone!=='trainer'){ phone.src=TRAINER_URL; loaded.phone='trainer'; } }
    else if(mode==='trainer-web'){ if(!loaded.web){ web.src=TRAINER_URL; loaded.web=true; } }
    try{ localStorage.setItem('fc_preview_mode', mode); }catch(e){}
    fit();
  }

  document.querySelectorAll('.switcher button').forEach(function(b){ b.addEventListener('click', function(){ setMode(b.dataset.mode); }); });

  // Fit the phone into the stage (below the switcher bar)
  var DEV_W = 393 + 24, DEV_H = 852 + 24;
  function fit(){
    var barH = 60, pad = 26;
    var availH = window.innerHeight - barH - pad, availW = window.innerWidth - pad;
    var s = Math.min(1, availW/DEV_W, availH/DEV_H);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);

  var start = 'client-phone';
  try{ start = localStorage.getItem('fc_preview_mode') || start; }catch(e){}
  setMode(start);
</script>
</body>
</html>
